<!DOCTYPE html>
<html>
    <head>
        

<meta charset='utf-8'>

<!-- title -->

<meta http-equiv='X-UA-Compatible' content='IE=edge,chrome=1'>

<!-- viewport -->
<meta name='viewport' content='width=device-width'>



        <style>
            :root {
                font-family: sans-serif;
                background-color: #f9fcfc;
            }
            ul {
                padding: 0;
                margin: 0;
            }
            li {
                list-style: none;
                padding: .4rem .8rem;
                margin: 0 0 1rem 0;
                background-color: #aee;
                border: 1px solid #8dd;
                border-radius: .4rem;
            }
            li button {
                margin-left: .4rem;
                padding: .2rem .4rem;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <h1>A ver si</h1>
        <ul id="tasks"></ul>
        <input type="button" value="Cargar" id="loadButton" />
        <input type="button" value="Guardar" id="saveButton" />
        <input type="text" id="newTaskName"><input type="button" id="addButton" value="Añadir">

        
        <script type="module">
            import { get, set } from 'https://unpkg.com/idb-keyval@5.0.2/dist/esm/index.js';

            const loadTasks = function() {
                const storageKey = "tasks"
                const savedTasksStr = localStorage.getItem(storageKey) ?? "[]"
                const savedTasks = JSON.parse(savedTasksStr)

                populateTasks(savedTasks)
            }
            const populateTasks = function(tasks) {
                const taskNodes = tasks.map((task) => {
                    const li = document.createElement("li")
                    const deleteButton = document.createElement("button")
                    deleteButton.setAttribute("data-task-name", task)
                    deleteButton.textContent = "x"
                    deleteButton.addEventListener("click", function(ev) {
                        const taskName = this.getAttribute("data-task-name")
                        deleteTask(taskName)
                    })
                    li.textContent = task
                    li.appendChild(deleteButton)
                    return li
                })
                document.querySelector("#tasks").innerHTML = ""
                for (node of taskNodes) {
                    document.querySelector("#tasks").appendChild(node)
                }
            }
            const addTask = function() {
                const newTaskName = document.querySelector("#newTaskName").value
                
                const storageKey = "tasks"
                const savedTasksStr = localStorage.getItem(storageKey) ?? "[]"
                const savedTasks = JSON.parse(savedTasksStr)

                const allTasks = [...savedTasks, newTaskName]
                localStorage.setItem(storageKey, JSON.stringify(allTasks))
                loadTasks()
                document.querySelector("#newTaskName").value = ""
            }
            const deleteTask = function(taskName) {
                const storageKey = "tasks"
                const savedTasksStr = localStorage.getItem(storageKey) ?? "[]"
                const savedTasks = JSON.parse(savedTasksStr)

                const allTasks = savedTasks.filter((t) => t != taskName)

                localStorage.setItem(storageKey, JSON.stringify(allTasks))
                loadTasks()
            }
            window.addEventListener("load", loadTasks)
            document.querySelector("#addButton").addEventListener("click", addTask)

            // global file handle
            let fileHandle = null;
                
            async function getFile() {

    const fileHandleOrUndefined = await get('file');
    if (fileHandleOrUndefined) {
      fileHandle = fileHandleOrUndefined;
    } else {
                // Open file picker and destructure the result the first handle
                const pickerOpts = {
                types: [
                    {
                    description: "JSON Files",
                    accept: {
                        "text/json": [".json"],
                    },
                    },
                ],
                excludeAcceptAllOption: true,
                multiple: false,
                };
                const [newFileHandle] = await window.showOpenFilePicker(pickerOpts);
                fileHandle = newFileHandle;
                await set('file', fileHandle);
    }
                
                const file = await fileHandle.getFile();
                populateTasks(JSON.parse(await file.text()))
                return file;
            }
            document.querySelector("#loadButton").addEventListener("click", getFile)


            async function saveFile() {
                // create a new handle
                // const newHandle = await window.showSaveFilePicker();

                // create a FileSystemWritableFileStream to write to
                const writableStream = await fileHandle.createWritable();

                // write our file
                await writableStream.write(imgBlob);

                // close the file and write the contents to disk.
                await writableStream.close();
            }
            document.querySelector("#saveButton").addEventListener("click", saveFile)


        </script>
    </body>
</html>
